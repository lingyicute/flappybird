name: Test & Deploy

on:
  push:
    branches: ["main"]
  pull_request:    
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium + system libraries
        run: |
          npx playwright install --with-deps chromium

      - name: Build single-file bundle
        run: npm run build

      - name: Run Playwright gates (release build)
        run: npm test

      - name: Run Playwright gates (dev build)
        run: npm run test:dev
        
  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage the Pages payload
        run: |
          # Only the playable site ships: node_modules, the test suite and its
          # screenshots must never bloat (or leak into) the Pages artifact.
          mkdir -p .pages-site
          cp index.html dev.html site.webmanifest favicon.ico favicon-96x96.png \
             LICENSE README.md .pages-site/
          cp -R assets audio fonts sprites .pages-site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.pages-site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
